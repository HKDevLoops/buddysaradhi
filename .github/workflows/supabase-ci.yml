name: Supabase CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/gateway/**'
      - '.github/workflows/supabase-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/gateway/**'
      - '.github/workflows/supabase-ci.yml'

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Gateway
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Deno Lint
        run: deno lint apps/gateway/

      - name: Deno Typecheck
        run: deno check apps/gateway/index.ts

  deploy:
    name: Deploy to Production
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Gateway
        run: |
          cd apps/gateway
          supabase functions deploy gateway --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Provision DB
        run: |
          cd apps/gateway
          supabase functions deploy provision-db --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Gateway GraphQL
        run: |
          cd apps/gateway
          supabase functions deploy gateway-graphql --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
