name: supabase-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/gateway/**'
      - '.github/workflows/supabase-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/gateway/**'
      - '.github/workflows/supabase-ci.yml'

permissions:
  contents: read

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Gateway
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Deno
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d  # v1
        with:
          deno-version: v2.x

      - name: Deno Lint
        run: deno lint apps/gateway/

      - name: Deno Typecheck
        run: deno check apps/gateway/index.ts

  deploy:
    name: Deploy to Production
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check secrets
        id: check-secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Checkout
        if: steps.check-secrets.outputs.has_token == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Deno
        if: steps.check-secrets.outputs.has_token == 'true'
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d  # v1
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        if: steps.check-secrets.outputs.has_token == 'true'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb  # v1
        with:
          version: latest

      - name: Deploy Gateway
        if: steps.check-secrets.outputs.has_token == 'true'
        run: |
          mkdir -p .temp-deploy/supabase/functions/gateway
          cp -r apps/gateway/* .temp-deploy/supabase/functions/gateway/
          cd .temp-deploy
          supabase functions deploy gateway --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
        env:
          # 2026-10-21 (SC-06): the project ref was a bare shell word carrying a
          # secret; it is now an environment variable, quoted.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy Provision DB
        if: steps.check-secrets.outputs.has_token == 'true'
        run: |
          mkdir -p .temp-deploy/supabase/functions/provision-db
          cp -r apps/gateway/provision/* .temp-deploy/supabase/functions/provision-db/
          cd .temp-deploy
          supabase functions deploy provision-db --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # The standalone `gateway-graphql` function was REMOVED (F-12a), not
      # redeployed: it served the same queries as the main gateway's
      # authenticated `/graphql` route but with no HMAC request binding, no
      # rate limiting and no body cap — any valid Supabase token could make
      # the edge POST to an attacker-chosen database host (SSRF + DDL). No
      # first-party caller ever used it (verified by repo-wide grep), so it
      # was deleted at `apps/gateway/graphql/index.ts` instead of hardened.
      #
      # OPERATOR ACTION STILL REQUIRED: removing this step stops future
      # deploys, but the last vulnerable build keeps serving until the remote
      # function is deleted:
      #   supabase functions delete gateway-graphql --project-ref <ref>
      # That needs SUPABASE_ACCESS_TOKEN and was not run from here.
