# .github/workflows/eas-update.yml
# Implements: deployment/05_CI_CD_GitHub_Actions.md §6 — EAS OTA
name: eas-update

on:
  push:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to push OTA to (production | staging)'
        required: true
        default: production

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect JS-only changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      js_only: ${{ steps.check.outputs.js_only }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 2

      - name: Check if changes are JS-only
        id: check
        run: |
          # Get the list of changed files in the latest push
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          # JS-only = no changes to app.json, app.config.js, native files
          if echo "$CHANGED" | grep -qE '(app\.json|app\.config\.js|apps/mobile/ios/|apps/mobile/android/|package\.json)'; then
            echo "js_only=false" >> $GITHUB_OUTPUT
          else
            echo "js_only=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine channel
        id: channel
        env:
          # A branch name can contain shell metacharacters, and GitHub
          # substitutes `${{ }}` before the shell parses the text, so the ref
          # arrives as an environment variable (data), never as script.
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$GIT_REF" == "refs/heads/main" ]]; then
            echo "channel=production" >> $GITHUB_OUTPUT
          elif [[ "$GIT_REF" == refs/heads/release/* ]]; then
            echo "channel=staging" >> $GITHUB_OUTPUT
          else
            echo "channel=development" >> $GITHUB_OUTPUT
          fi

  ota:
    name: EAS Update OTA
    needs: detect-changes
    if: needs.detect-changes.outputs.js_only == 'true' && vars.EXPO_PROJECT_ID != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check EAS token
        id: check-token
        run: |
          if [ -z "$EAS_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}

      - name: Checkout
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Bun
        if: steps.check-token.outputs.has_token == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.3

      - name: Setup Expo
        if: steps.check-token.outputs.has_token == 'true'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Install dependencies
        if: steps.check-token.outputs.has_token == 'true'
        run: bun install --frozen-lockfile

      - name: Push OTA update
        if: steps.check-token.outputs.has_token == 'true'
        env:
          # 2026-10-21 (supply-chain audit, SC-07): these were interpolated
          # DIRECTLY into the shell script:
          #     CHANNEL=${{ needs.detect-changes.outputs.channel }}
          #     COMMIT_MSG="${{ github.event.head_commit.message }}"
          # GitHub substitutes `${{ ... }}` BEFORE the shell sees the text, so a
          # commit message containing `$(...)` or backticks executes arbitrary
          # commands in a runner that holds EAS_TOKEN. The "sanitise" comment
          # below the old code was a fiction: the substitution had already
          # happened by then. The values now arrive as ENVIRONMENT VARIABLES,
          # which are data, not code, and the shell never re-parses them.
          CHANNEL: ${{ needs.detect-changes.outputs.channel }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          set -euo pipefail
          # Belt-and-braces: the channel is a closed set, so reduce it to
          # [A-Za-z0-9-] before it is used as a CLI argument.
          CHANNEL_CLEAN=$(printf '%s' "$CHANNEL" | tr -cd '[:alnum:]-')
          if [ -z "$CHANNEL_CLEAN" ]; then
            echo "::error::refusing to push an OTA update with an empty channel"
            exit 1
          fi
          # One line, no quotes/backticks/$() — it is a commit MESSAGE, not a
          # shell fragment.
          COMMIT_MSG_CLEAN=$(printf '%s' "$COMMIT_MSG" | head -1 | tr -cd '[:print:]')
          eas update --branch "$CHANNEL_CLEAN" --channel "$CHANNEL_CLEAN" \
            --message "$COMMIT_MSG_CLEAN" --non-interactive

      - name: Notify on success
        if: steps.check-token.outputs.has_token == 'true'
        env:
          # 2026-10-21 (SC-07): the webhook URL was interpolated straight into
          # the shell command line, and the commit message was interpolated
          # into a JSON string literal. Both are injection sinks, and a secret
          # written into a `run:` body is also visible in the process table.
          # Everything now arrives as an environment variable and the payload
          # is built with a real JSON encoder.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL: ${{ needs.detect-changes.outputs.channel }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          CONTENT=$(printf '✅ EAS OTA pushed to %s — %s' "$CHANNEL" "$COMMIT_MSG" \
            | head -1 | tr -cd '[:print:]')
          PAYLOAD=$(printf '%s' "$CONTENT" | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')
          curl -sS -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Notify on failure
        if: failure() && steps.check-token.outputs.has_token == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          PAYLOAD=$(printf '⚠️ eas-update failed on %s' "$REF_NAME" \
            | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')
          curl -sS -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

