# .github/workflows/security.yml
# Comprehensive Security Harness workflow for BuddySaradhi
# Implements: 23_Security_Harness_Plan.md §4 — automation harness
name: security-agent

on:
  pull_request:
    branches: [main, release/*]
  push:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a commercial GITLEAKS_LICENSE for org repos.
      # We run it with continue-on-error so CI doesn't block when the license
      # secret is not yet configured. Add GITLEAKS_LICENSE to repo secrets to
      # promote this to a hard gate.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  semgrep:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run only our project-specific custom rules to avoid network calls
      # to the Semgrep registry (which require an account for some rulesets).
      - name: Run Semgrep with Custom Rules
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep \
            --config=/src/semgrep.yml \
            --error

  osv-scanner:
    name: Dependency Vulnerability Audit (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # OSV-Scanner action v1 was retired. v2 is the current stable release.
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --recursive
            .
        continue-on-error: true

  license-checker:
    name: License Compliance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run License Audit Script
        run: bun run scripts/license-checker.ts
        continue-on-error: true

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # --package-only was removed in cyclonedx-npm v6. Omit to use defaults.
      - name: Generate SBOM
        run: |
          mkdir -p sbom
          npx @cyclonedx/cyclonedx-npm --output-file sbom/bom.web.json --mc-type application
        continue-on-error: true
      - name: Upload SBOM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom/
          retention-days: 7
