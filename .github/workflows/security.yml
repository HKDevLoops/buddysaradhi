# .github/workflows/security.yml
# Comprehensive Security Harness workflow for BuddySaradhi
# Implements: 23_Security_Harness_Plan.md §4 — automation harness
name: security-agent

on:
  pull_request:
    branches: [main, release/*]
  push:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      # CI-SUPPLY-05 / SEC-CRED-06 — this was `gitleaks-action@v2` with
      # `continue-on-error: true`, i.e. a scan nobody was blocked by: it printed
      # findings and CI went green anyway. An advisory secret scan is a comment.
      #
      # It is now the OpenGITLEAKS CLI installed directly, matching the OSV job
      # below (same rationale: the Docker/action wrappers have had versioning and
      # licensing problems — this one needs a commercial GITLEAKS_LICENSE on org
      # repos, which is why it was advisory in the first place). The CLI needs no
      # licence and no token, so the step below has NO secrets at all.
      #
      # `--redact` is mandatory, not a preference: without it gitleaks prints the
      # detected secret into the job log, leaking the credential a second time to
      # an audience with wider access than the file it was found in.
      - name: Install Gitleaks
        run: |
          # Pinned by SHA256, not just by tag. This PR exists to pin CI to
          # immutable references (CI-SUPPLY-05); downloading a binary from a
          # mutable release tag with `curl | tar` would undercut that in the very
          # step that feeds the gate. A tag can be moved; this digest cannot.
          # Verified independently against gitleaks' published checksums file.
          set -euo pipefail
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin gitleaks < /tmp/gitleaks.tar.gz
          rm -f /tmp/gitleaks.tar.gz
          chmod +x /usr/local/bin/gitleaks
          gitleaks version
      - name: Run Gitleaks (hard gate)
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --verbose .
      # NOTE: deliberately NO `continue-on-error` and NO GITHUB_TOKEN here.
      # A finding fails the job. That is the whole point of the change, and it
      # matches AGENTS.md §2 Rule 9 — a scan that reports and passes is worse than
      # no scan, because it reads as coverage that does not exist.

  semgrep:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # Run only our project-specific custom rules to avoid network calls
      # to the Semgrep registry (which require an account for some rulesets).
      - name: Run Semgrep with Custom Rules
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep \
            --config=/src/semgrep.yml \
            --error

  osv-scanner:
    name: Dependency Vulnerability Audit (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # Install OSV-Scanner CLI directly for reliable cross-platform use.
      # The github action wrapper has had versioning issues; direct binary is stable.
      - name: Install OSV-Scanner
        run: |
          curl -L https://github.com/google/osv-scanner/releases/download/v1.9.1/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
      - name: Run OSV-Scanner
        run: osv-scanner --lockfile=pnpm-lock.yaml .
        continue-on-error: true

  license-checker:
    name: License Compliance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 11.15.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run License Audit Script
        run: bun run scripts/license-checker.ts
        continue-on-error: true

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      # --package-only was removed in cyclonedx-npm v6. Omit to use defaults.
      - name: Generate SBOM
        run: |
          mkdir -p sbom
          npm install -g @cyclonedx/cyclonedx-npm 2>/dev/null || true
          cyclonedx-npm --output-format JSON --output-file sbom/bom.web.json || \
            npx --yes @cyclonedx/cyclonedx-npm@latest --output-format JSON --output-file sbom/bom.web.json || \
            echo "SBOM generation skipped — tool unavailable"
        continue-on-error: true
      - name: Upload SBOM Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cyclonedx-sbom
          path: sbom/
          retention-days: 7
