# .github/workflows/lint.yml
# Implements: deployment/05_CI_CD_GitHub_Actions.md §2 — lint gate
name: lint

on:
  pull_request:
    branches: [main, release/*]
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testing_agent:
    name: Testing Agent (Lint + Typecheck + Tests)
    runs-on: ubuntu-22.04
    env:
      TURSO_DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      TURSO_AUTH_TOKEN: test-token
      DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Point Playwright to the live Vercel deployment so no local server needed
      PLAYWRIGHT_TEST_BASE_URL: https://buddysaradhi.vercel.app
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Deno (for gateway lint)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Lint
        run: pnpm run lint
        timeout-minutes: 5

      - name: Typecheck
        run: pnpm run typecheck
        timeout-minutes: 5

      - name: Unit tests
        run: pnpm run test:unit
        timeout-minutes: 5

      - name: Integration tests
        run: pnpm run test:integration
        timeout-minutes: 5

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install chromium --with-deps
        timeout-minutes: 5

      - name: Accessibility tests
        run: pnpm run test:a11y
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Version consistency check
        run: pnpm run version:check
        timeout-minutes: 1
