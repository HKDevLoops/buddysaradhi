# .github/workflows/lint.yml
# Implements: deployment/05_CI_CD_GitHub_Actions.md §2 — lint gate
name: lint

on:
  pull_request:
    branches: [main, release/*]
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testing_agent:
    name: Testing Agent (Lint + Typecheck + Tests)
    runs-on: ubuntu-22.04
    env:
      TURSO_DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      TURSO_AUTH_TOKEN: test-token
      DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Report F-6/F-9: no playwright steps in this job — lint.yml does not
      # build or serve the app. e2e + axe run against a yaml-managed local
      # server in test.yml (build -> :3300 -> playwright -> teardown), never
      # against the production deployment.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Deno (for gateway lint)
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d  # v1
        with:
          deno-version: v2.x

      - name: Lint
        run: bun run lint
        timeout-minutes: 5

      - name: OxLint (Rule 9 — no silent failures)
        run: bun run lint:oxlint
        timeout-minutes: 5

      - name: Typecheck
        run: bun run typecheck
        timeout-minutes: 5

      - name: Unit tests
        run: bun run test:unit
        timeout-minutes: 5

      - name: Integration tests
        run: bun run test:integration
        timeout-minutes: 5

      # Report F-5: root vitest.config.ts excludes apps/web/**, so this suite
      # (61 tests) was in no always-on CI workflow and could never fail a PR.
      - name: Web unit tests (vitest)
        run: cd apps/web && bunx vitest run
        timeout-minutes: 5

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Version consistency check
        run: bun run version:check
        timeout-minutes: 1
