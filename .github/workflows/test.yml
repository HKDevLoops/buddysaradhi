name: CI / Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      TURSO_AUTH_TOKEN: test-token
      DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # E2E tests hit the live Vercel deployment — no local server needed.
      # The Vercel app has real Supabase + Turso connections.
      PLAYWRIGHT_TEST_BASE_URL: https://buddysaradhi.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Lint
        run: pnpm --filter web lint

      - name: Unit & Component Tests (Vitest)
        run: pnpm --filter web test -- run

      - name: Build Web App
        run: pnpm --filter web build

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps

      - name: End-to-End Tests (Playwright)
        run: pnpm --filter web exec playwright test
        continue-on-error: true
