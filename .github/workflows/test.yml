  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      TURSO_AUTH_TOKEN: test-token
      DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      NEXT_PUBLIC_SUPABASE_URL: https://gmqwdnvbfnwpzpctwvho.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtcXdkbnZiZm53cHpwY3R3dmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NzYyMjAsImV4cCI6MjA5ODE1MjIyMH0.M--_VPKADCmwai3jHgF1id7kIpBAtvA6qvljDHU6JUI
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtcXdkbnZiZm53cHpwY3R3dmhvIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MjU3NjIyMCwiZXhwIjoyMDk4MTUyMjIwfQ.9W7J61sK2nPMw7IDRB678UQYjktR0VOfNbs3TXHPdz8
      E2E_EMAIL: hkdevloops@gmail.com
      E2E_PASSWORD: hkdevs
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Lint
        run: pnpm --filter web lint

      - name: Unit & Component Tests (Vitest)
        run: pnpm --filter web test -- run

      - name: Build Web App
        run: pnpm --filter web build

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps

      - name: End-to-End Tests (Playwright)
        run: pnpm --filter web exec playwright test
