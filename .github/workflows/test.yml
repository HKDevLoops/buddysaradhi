name: CI / Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      TURSO_AUTH_TOKEN: test-token
      DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Credential-gate flag for the axe step below. `secrets` context is not
      # available in step-level `if:` (rejected at parse time), so the
      # presence check is evaluated once here where secrets ARE readable.
      HAS_E2E_CREDENTIALS: ${{ secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' }}
      # Report F-6: production must never receive write-e2e — the stress/palette
      # specs WRITE settings to whatever DB serves the base URL. Local-server
      # recipe per scratch/fullpass.sh: build -> start :3300 -> readiness wait
      # -> playwright -> teardown (steps below). The local server talks to the
      # same real Supabase (E2E_* secrets), so auth flows still work; NEXT_PUBLIC_*
      # is baked into the bundle by the build step below (same job env).
      # 127.0.0.1 on purpose (not localhost): playwright.config.ts spawns its own
      # webServer only for baseURLs starting with http://localhost, and
      # reuseExistingServer=false in CI would abort with "url is already used"
      # while our yaml-managed server is up.
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 5

      # The root `typecheck` chain now includes the gateway's real
      # `deno check --config deno.json index.ts` (audit AUD-020/AUD-021 — the
      # gateway's own lint/typecheck scripts used to be `echo` stubs that
      # linted nothing and always exited 0). Deno must therefore be on PATH
      # before the Typecheck step below.
      - name: Setup Deno (for the gateway typecheck)
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d  # v1
        with:
          deno-version: v2.x

      - name: Typecheck
        run: bun run typecheck
        timeout-minutes: 5

      - name: Lint
        run: bun run lint
        timeout-minutes: 5

      - name: Unit & Component Tests (Vitest)
        run: bun run test:unit
        timeout-minutes: 5

      # Report F-5: root vitest.config.ts excludes apps/web/**, so this suite
      # (61 tests) was in no CI workflow and could never fail a PR.
      - name: Web unit tests (vitest)
        run: cd apps/web && bunx vitest run
        timeout-minutes: 5

      # The perf gates are the only tests whose result depends on how fast the
      # machine is, so they run in a LANE OF THEIR OWN: one worker, nothing
      # else competing for the CPU they are timing. They are excluded from the
      # parallel suites (the root, integration and gateway configs) for exactly
      # that reason - a perf measurement taken while fifty other files burn the
      # CPU is not a measurement of anything.
      - name: Perf gates (own serial lane)
        run: bunx vitest run --config apps/gateway/vitest.perf.config.ts
        timeout-minutes: 5

      # Product-page node:test suites (admin access-requests + engine) run
      # outside vitest by design — root vitest.config.ts excludes them.
      - name: Product-page contract tests (node:test)
        run: bun --filter product-page test
        timeout-minutes: 5

      # AGENTS §7.4 / report L6: coverage floors enforced — ≥70% lines on
      # packages/core and packages/shared. --coverage.all so never-imported
      # files count (verified: core 97.45%, shared 100%).
      - name: Coverage floors (core + shared ≥70% lines)
        run: |
          cd packages/core && bunx vitest run --coverage --coverage.all --coverage.thresholds.lines=70
          cd ../shared && bunx vitest run --coverage --coverage.all --coverage.thresholds.lines=70
        timeout-minutes: 10

      - name: Build Web App & Product Page
        run: bun --filter web build && bun --filter product-page build
        timeout-minutes: 10

      - name: Install Playwright Browsers
        run: cd apps/web && bunx playwright install --with-deps
        timeout-minutes: 5

      # Report F-6: serve the freshly built app locally (scratch/fullpass.sh §8).
      # setsid puts bun/next in their own process group so teardown can kill
      # the whole tree; readiness loop mirrors fullpass.sh's curl poll.
      - name: "Start local web server (F-6: e2e runs locally, never production)"
        run: |
          nohup setsid sh -c 'cd apps/web && bunx next start -p 3300' > /tmp/webserver.log 2>&1 &
          echo $! > /tmp/webserver.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3300/; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::local web server did not become ready on :3300 within 60s"
          cat /tmp/webserver.log
          exit 1
        timeout-minutes: 2

      # Rule 10 / report F-9 / audit AUD-024: the CREDENTIAL-FREE axe gate.
      # It runs against the LOCAL server above, needs no CI secrets, and
      # therefore never skips. It fails when the server is unreachable, when a
      # route did not render (a vacuous axe pass on an error page is not a
      # pass), and on a `critical` WCAG violation — the gate policy of
      # 21_Automation_Testing.md §6. This is the blocking accessibility
      # contract; the credentialed suite below extends it to the five
      # product screens when a QA account is provisioned.
      - name: Accessibility gate (axe-core, credential-free — never skips)
        run: bun scripts/a11y-gate.ts
        env:
          A11Y_BASE_URL: http://127.0.0.1:3300
        timeout-minutes: 5

      # Rule 10 / report F-9: the FULL axe suite (all five product screens,
      # authenticated as a QA tutor) against the local server above —
      # BLOCKING (no continue-on-error), separate from the soft e2e batch so an
      # accessibility regression is never hidden inside continue-on-error.
      # All 4 engines incl. webkit + Mobile Safari pass (F-3 fixed test-side:
      # apps/web/tests/e2e/csp-test-helper.ts strips the inert-on-https
      # upgrade-insecure-requests directive so the plain-http test origin
      # behaves like the https production origin). Verified green locally on
      # all 5 persistent screens (axe violations: 0).
      # CREDENTIAL GATE. The axe suite authenticates as a QA tutor, and since
      # CI-SUPPLY-05 the harness carries NO built-in credential (the hardcoded
      # fallback was a committed secret — fail-closed, never again). So this
      # step runs only when the repo provides E2E_EMAIL/E2E_PASSWORD secrets;
      # otherwise it is SKIPPED — but the credential-free gate above still
      # ran and still blocks, so Rule 10 has a guaranteed gate either way.
      # A skipped gate is recorded, not hidden: the notice below names exactly
      # what re-arms it. Owner action: provision a dedicated CI QA account and
      # add both secrets — the full gate goes blocking again with zero code
      # change.
      - name: Accessibility tests (axe-core, blocking when credentialed)
        if: env.HAS_E2E_CREDENTIALS == 'true'
        run: bun run test:a11y
        timeout-minutes: 5

      - name: Notice skipped authenticated axe gate (no E2E credentials configured)
        if: env.HAS_E2E_CREDENTIALS != 'true'
        run: |
          echo '::notice::The authenticated axe gate (five product screens) is SKIPPED — E2E_EMAIL/E2E_PASSWORD secrets are not configured. Add a dedicated CI QA account to re-arm it. The credential-free accessibility gate above ran and is blocking; unit + integration coverage still enforced.'

      - name: End-to-End Tests (Playwright)
        run: cd apps/web && bunx playwright test
        timeout-minutes: 10
        continue-on-error: true # SOFT by design: e2e is flaky-by-nature; axe above is the blocking gate. Do NOT harden.

      - name: Stop local web server
        if: always()
        run: |
          if [ -f /tmp/webserver.pid ]; then
            kill -- -"$(cat /tmp/webserver.pid)" 2>/dev/null || true
          fi
          pkill -f "next start -p 3300" 2>/dev/null || true
          pkill -f "next-server" 2>/dev/null || true
