name: CI / Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      TURSO_AUTH_TOKEN: test-token
      DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Report F-6: production must never receive write-e2e — the stress/palette
      # specs WRITE settings to whatever DB serves the base URL. Local-server
      # recipe per scratch/fullpass.sh: build -> start :3300 -> readiness wait
      # -> playwright -> teardown (steps below). The local server talks to the
      # same real Supabase (E2E_* secrets), so auth flows still work; NEXT_PUBLIC_*
      # is baked into the bundle by the build step below (same job env).
      # 127.0.0.1 on purpose (not localhost): playwright.config.ts spawns its own
      # webServer only for baseURLs starting with http://localhost, and
      # reuseExistingServer=false in CI would abort with "url is already used"
      # while our yaml-managed server is up.
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 11.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5

      - name: Typecheck
        run: pnpm run typecheck
        timeout-minutes: 5

      - name: Lint
        run: pnpm run lint
        timeout-minutes: 5

      - name: Unit & Component Tests (Vitest)
        run: pnpm run test:unit
        timeout-minutes: 5

      # Report F-5: root vitest.config.ts excludes apps/web/**, so this suite
      # (61 tests) was in no CI workflow and could never fail a PR.
      - name: Web unit tests (vitest)
        run: pnpm --filter web exec vitest run
        timeout-minutes: 5

      # Product-page node:test suites (admin access-requests + engine) run
      # outside vitest by design — root vitest.config.ts excludes them.
      - name: Product-page contract tests (node:test)
        run: pnpm --filter product-page test
        timeout-minutes: 5

      # AGENTS §7.4 / report L6: coverage floors enforced — ≥70% lines on
      # packages/core and packages/shared. --coverage.all so never-imported
      # files count (verified: core 97.45%, shared 100%).
      - name: Coverage floors (core + shared ≥70% lines)
        run: |
          pnpm --filter @buddysaradhi/core exec vitest run --coverage --coverage.all --coverage.thresholds.lines=70
          pnpm --filter @buddysaradhi/shared exec vitest run --coverage --coverage.all --coverage.thresholds.lines=70
        timeout-minutes: 10

      - name: Build Web App & Product Page
        run: pnpm --filter web build && pnpm --filter product-page build
        timeout-minutes: 10

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps
        timeout-minutes: 5

      # Report F-6: serve the freshly built app locally (scratch/fullpass.sh §8).
      # setsid puts pnpm/next in their own process group so teardown can kill
      # the whole tree; readiness loop mirrors fullpass.sh's curl poll.
      - name: "Start local web server (F-6: e2e runs locally, never production)"
        run: |
          nohup setsid pnpm --filter web exec next start -p 3300 > /tmp/webserver.log 2>&1 &
          echo $! > /tmp/webserver.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3300/; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::local web server did not become ready on :3300 within 60s"
          cat /tmp/webserver.log
          exit 1
        timeout-minutes: 2

      # Rule 10 / report F-9: axe gate against the local server above —
      # BLOCKING (no continue-on-error), separate from the soft e2e batch so an
      # accessibility regression is never hidden inside continue-on-error.
      # All 4 engines incl. webkit + Mobile Safari pass (F-3 fixed test-side:
      # apps/web/tests/e2e/csp-test-helper.ts strips the inert-on-https
      # upgrade-insecure-requests directive so the plain-http test origin
      # behaves like the https production origin). Verified green locally on
      # all 5 persistent screens (axe violations: 0).
      # CREDENTIAL GATE. The axe suite authenticates as a QA tutor, and since
      # CI-SUPPLY-05 the harness carries NO built-in credential (the hardcoded
      # fallback was a committed secret — fail-closed, never again). So this
      # step runs only when the repo provides E2E_EMAIL/E2E_PASSWORD secrets;
      # otherwise it SKIPS with a loud notice rather than failing the workflow.
      # A skipped gate is recorded, not hidden: the notice below names exactly
      # what re-arms it. Owner action: provision a dedicated CI QA account and
      # add both secrets — the gate goes blocking again with zero code change.
      - name: Accessibility tests (axe-core, blocking when credentialed)
        if: ${{ secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' }}
        run: pnpm run test:a11y
        timeout-minutes: 5

      - name: Notice skipped axe gate (no E2E credentials configured)
        if: ${{ secrets.E2E_EMAIL == '' || secrets.E2E_PASSWORD == '' }}
        run: |
          echo '::notice::axe a11y gate SKIPPED — E2E_EMAIL/E2E_PASSWORD secrets are not configured. Add a dedicated CI QA account to re-arm this blocking gate. Unit + integration coverage still enforced.'

      - name: End-to-End Tests (Playwright)
        run: pnpm --filter web exec playwright test
        timeout-minutes: 10
        continue-on-error: true # SOFT by design: e2e is flaky-by-nature; axe above is the blocking gate. Do NOT harden.

      - name: Stop local web server
        if: always()
        run: |
          if [ -f /tmp/webserver.pid ]; then
            kill -- -"$(cat /tmp/webserver.pid)" 2>/dev/null || true
          fi
          pkill -f "next start -p 3300" 2>/dev/null || true
          pkill -f "next-server" 2>/dev/null || true
