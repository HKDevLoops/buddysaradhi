# .github/workflows/desktop-build.yml
# Implements: deployment/05_CI_CD_GitHub_Actions.md §5 — desktop build
name: desktop-build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.4.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            installer_ext: msi
            artifact_glob: "*.msi"
          - platform: macos-latest
            target: universal-apple-darwin
            installer_ext: dmg
            artifact_glob: "*.dmg"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            installer_ext: AppImage
            artifact_glob: "*.AppImage"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249  # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Next.js
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js (for Tauri static export)
        run: bun --filter web build

      - name: Sign + Build (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          # Decode the codesign cert from base64 secret
          echo "$WINDOWS_CODESIGN_PFX" | base64 -d > cert.pfx
          # Build with Tauri (signtool runs as a post-build step via tauri.conf.json)
          bunx tauri build
        working-directory: apps/desktop
        env:
          # 2026-10-21 (SC-06): the signing key, its password and the base64
          # PFX were interpolated into the shell body. A secret in a `run:`
          # body lands in the rendered script and in the process table; `env:`
          # passes it as data the shell never re-parses.
          WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Sign + Notarize + Build (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          bunx tauri build
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}

      - name: Build (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
          bunx tauri build
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload to Vercel Blob
        id: upload
        env:
          # 2026-10-21 (SC-06): matrix values were interpolated into the shell.
          ARTIFACT_GLOB: ${{ matrix.artifact_glob }}
          PLATFORM: ${{ matrix.platform }}
          INSTALLER_EXT: ${{ matrix.installer_ext }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Find the installer
          INSTALLER=$(find apps/desktop/src-tauri/target/release/bundle -name "$ARTIFACT_GLOB" | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "FAIL: no installer found"
            exit 1
          fi
          # Determine the blob pathname
          case "$PLATFORM" in
            windows-latest) BLOB_PATH="desktop/windows/Buddysaradhi-${VERSION}-x64.${{ matrix.installer_ext }}" ;;
            macos-latest)   BLOB_PATH="desktop/macos/Buddysaradhi-${VERSION}-universal.${{ matrix.installer_ext }}" ;;
            ubuntu-22.04)   BLOB_PATH="desktop/linux/Buddysaradhi-${VERSION}-x86_64.${{ matrix.installer_ext }}" ;;
          esac
          # Upload
          UPLOAD_RESULT=$(bun scripts/blob-upload.ts \
            --local-path "$INSTALLER" \
            --blob-pathname "$BLOB_PATH" \
            --content-type "application/octet-stream" \
            --output-json)
          echo "$UPLOAD_RESULT"
          URL=$(echo "$UPLOAD_RESULT" | jq -r '.url')
          SHA256=$(echo "$UPLOAD_RESULT" | jq -r '.sha256')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "blob_path=$BLOB_PATH" >> $GITHUB_OUTPUT
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Upload signature to Vercel Blob
        env:
          # 2026-10-21 (SC-06): matrix values were interpolated into the shell.
          ARTIFACT_GLOB: ${{ matrix.artifact_glob }}
          PLATFORM: ${{ matrix.platform }}
          INSTALLER_EXT: ${{ matrix.installer_ext }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          INSTALLER=$(find apps/desktop/src-tauri/target/release/bundle -name "$ARTIFACT_GLOB" | head -1)
          SIG_FILE="${INSTALLER}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "FAIL: no .sig file found at $SIG_FILE"
            exit 1
          fi
          case "$PLATFORM" in
            windows-latest) SIG_BLOB_PATH="desktop/windows/Buddysaradhi-${VERSION}-x64.${INSTALLER_EXT}.sig" ;;
            macos-latest)   SIG_BLOB_PATH="desktop/macos/Buddysaradhi-${VERSION}-universal.${INSTALLER_EXT}.sig" ;;
            ubuntu-22.04)   SIG_BLOB_PATH="desktop/linux/Buddysaradhi-${VERSION}-x86_64.${INSTALLER_EXT}.sig" ;;
          esac
          node scripts/blob-upload.ts \
            --local-path "$SIG_FILE" \
            --blob-pathname "$SIG_BLOB_PATH" \
            --content-type "application/octet-stream"
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    outputs:
      url: ${{ steps.upload.outputs.url }}
      sha256: ${{ steps.upload.outputs.sha256 }}
      blob_path: ${{ steps.upload.outputs.blob_path }}

  update-manifest:
    name: Update desktop-staging.json manifest
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.3

      - name: Build manifest update
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # The build job's outputs are arrays (one per matrix entry); iterate
          bun scripts/build-manifest.ts \
            --version "$VERSION" \
            --commit "${{ github.sha }}" \
            --output manifests/desktop-staging.json
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Verify manifest
        run: bun scripts/verify-manifest.ts --manifest manifests/desktop-staging.json

      - name: Notify on completion
        env:
          # 2026-10-21 (SC-06): the webhook URL was a bare word in the command
          # line and the payload was hand-built JSON.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          CONTENT=$(printf '✅ desktop-build complete for %s — manifest at desktop-staging.json' "$REF_NAME")
          PAYLOAD=$(printf '%s' "$CONTENT" | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')
          curl -sS -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured — skipping notification."
            exit 0
          fi
          CONTENT=$(printf '⚠️ desktop-build failed on %s' "$REF_NAME")
          PAYLOAD=$(printf '%s' "$CONTENT" | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')
          curl -sS -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

