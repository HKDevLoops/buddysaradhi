name: Production Gate (P1)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/gateway/**"
      - "packages/**"
      - ".github/workflows/web-prod-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/gateway/**"
      - "packages/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Gateway uses `env("DATABASE_URL")`. Prisma resolves a relative `file:`
      # URL against the schema directory while @libsql/client resolves it
      # against the process CWD, so an absolute path is required for db:push
      # and the ledger verify step to hit the same SQLite file.
      DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      TURSO_DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      TURSO_AUTH_TOKEN: test-token
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      PLAYWRIGHT_TEST_BASE_URL: https://buddysaradhi.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- packages/core (ledger engine) ---
      - name: Generate Prisma client (root schema, used by packages/core)
        run: pnpm exec prisma generate

      - name: Core / Typecheck
        run: pnpm --filter @buddysaradhi/core typecheck

      - name: Core / Lint
        run: pnpm --filter @buddysaradhi/core lint

      - name: Core / Unit Tests (Vitest)
        run: pnpm --filter @buddysaradhi/core test

      # --- apps/web ---
      - name: Web / Lint
        run: pnpm --filter web lint

      - name: Web / Typecheck
        run: pnpm --filter web typecheck

      - name: Web / Unit Tests (Vitest)
        run: pnpm --filter web test -- run

      - name: Web & Product Page / Build
        run: pnpm --filter web build && pnpm --filter product-page build

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps

      - name: E2E Tests (Playwright)
        run: pnpm --filter web exec playwright test
        continue-on-error: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      # --- apps/gateway (Deno-based) ---
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Gateway / Lint
        run: deno lint apps/gateway/

      - name: Gateway / Typecheck
        run: deno check apps/gateway/index.ts
