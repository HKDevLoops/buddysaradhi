name: Production Gate (P1)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/gateway/**"
      - "packages/**"
      - ".github/workflows/web-prod-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/gateway/**"
      - "packages/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Gateway uses `env("DATABASE_URL")`. Prisma resolves a relative `file:`
      # URL against the schema directory while @libsql/client resolves it
      # against the process CWD, so an absolute path is required for db:push
      # and the ledger verify step to hit the same SQLite file.
      DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      TURSO_DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      TURSO_AUTH_TOKEN: test-token
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Credential-gate flag for the AUTHENTICATED axe step below. `secrets`
      # is not readable in a step-level `if:` (rejected at parse time), so the
      # presence check is evaluated once here, where secrets ARE readable.
      HAS_E2E_CREDENTIALS: ${{ secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' }}
      # Report F-6: production must never receive write-e2e (stress/palette specs
      # write settings). Serve the build from this job locally — same recipe as
      # test.yml / scratch/fullpass.sh: build -> start :3300 -> readiness ->
      # playwright -> teardown (steps below). 127.0.0.1 (not localhost) so
      # playwright.config.ts does not auto-spawn a second webServer (CI sets
      # reuseExistingServer=false, which would abort with "url is already used").
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --- packages/core (ledger engine) ---
      - name: Generate Prisma client (root schema, used by packages/core)
        run: bunx prisma generate

      - name: Core / Typecheck
        run: bun --filter @buddysaradhi/core typecheck

      - name: Core / Lint
        run: bun --filter @buddysaradhi/core lint

      - name: Core / Unit Tests (Vitest)
        run: bun --filter @buddysaradhi/core test

      # --- apps/web ---
      - name: Web / Lint
        run: bun --filter web lint

      - name: Web / Typecheck
        # `@buddysaradhi/design-system` ships types from `dist/`, which is
        # gitignored, so a clean runner has no declarations for it. The root
        # `typecheck` script builds it first; calling the filter directly skipped
        # that and failed with TS2307 on every consumer.
        run: bun --filter @buddysaradhi/design-system build && bun --filter web typecheck

      - name: Web / Unit Tests (Vitest)
        run: bun --filter web test -- run

      - name: Web & Product Page / Build
        run: bun --filter web build && bun --filter product-page build

      - name: Install Playwright Browsers
        run: cd apps/web && bunx playwright install --with-deps

      # Report F-6: serve the freshly built app locally (scratch/fullpass.sh §8).
      # setsid puts bun/next in their own process group so teardown can kill
      # the whole tree; readiness loop mirrors fullpass.sh's curl poll.
      - name: "Start local web server (F-6: e2e runs locally, never production)"
        run: |
          nohup setsid sh -c 'cd apps/web && bunx next start -p 3300' > /tmp/webserver.log 2>&1 &
          echo $! > /tmp/webserver.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3300/; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::local web server did not become ready on :3300 within 60s"
          cat /tmp/webserver.log
          exit 1
        timeout-minutes: 2

      # Rule 10 / audit AUD-024: the CREDENTIAL-FREE axe gate. It runs
      # against the local server above, needs no CI secrets, and therefore
      # never skips — it fails when the server is unreachable, when a route
      # did not render, and on a `critical` WCAG violation (the gate policy
      # of 21_Automation_Testing.md §6). This is the blocking accessibility
      # contract on the production-gate workflow.
      - name: Accessibility gate (axe-core, credential-free — never skips)
        run: bun scripts/a11y-gate.ts
        env:
          A11Y_BASE_URL: http://127.0.0.1:3300
        timeout-minutes: 5

      # Rule 10 (mirror test.yml): the FULL axe suite — all five product
      # screens, authenticated as a QA tutor — against the local server above.
      # It needs the CI QA account, so it runs only when the secrets exist;
      # the credential-free gate above always runs and always blocks.
      - name: Accessibility tests (axe-core, blocking when credentialed)
        if: env.HAS_E2E_CREDENTIALS == 'true'
        run: bun run test:a11y
        timeout-minutes: 5

      - name: Notice skipped authenticated axe gate (no E2E credentials configured)
        if: env.HAS_E2E_CREDENTIALS != 'true'
        run: |
          echo '::notice::The authenticated axe gate (five product screens) is SKIPPED — E2E_EMAIL/E2E_PASSWORD secrets are not configured. Add a dedicated CI QA account to re-arm it. The credential-free accessibility gate above ran and is blocking.'

      - name: E2E Tests (Playwright)
        run: cd apps/web && bunx playwright test
        continue-on-error: true
        # Playwright stays SOFT (continue-on-error): the e2e batch is
        # flaky-by-nature (timers, webkit); the axe gate above is the
        # blocking accessibility contract. Hardening e2e would block merges
        # on flakes, not regressions.

      - name: Stop local web server
        if: always()
        run: |
          if [ -f /tmp/webserver.pid ]; then
            kill -- -"$(cat /tmp/webserver.pid)" 2>/dev/null || true
          fi
          pkill -f "next start -p 3300" 2>/dev/null || true
          pkill -f "next-server" 2>/dev/null || true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      # --- apps/gateway (Deno-based) ---
      - name: Setup Deno
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d  # v1
        with:
          deno-version: v2.x

      - name: Gateway / Lint
        run: deno lint apps/gateway/

      - name: Gateway / Typecheck
        run: deno check apps/gateway/index.ts
