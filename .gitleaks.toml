# .gitleaks.toml
# Configuration for Gitleaks secrets detection
#
# Schema: v8.30.x. The singular `[allowlist]` table is DEPRECATED in v8 and is
# hard-rejected when used alongside `[[allowlists]]` ("[allowlist] is
# deprecated, it cannot be used alongside [[allowlists]]"). This file is now
# entirely `[[allowlists]]`, which is the supported form going forward.

# Global allowlist: build artefacts and lockfiles are not source, and scanning
# them produces noise that trains people to ignore the gate.
[[allowlists]]
description = "Global allowlist for Gitleaks"
paths = [
  "node_modules",
  ".next",
  "dist",
  "build",
  "bun.lockb",
  "package-lock.json",
  "pnpm-lock.yaml"
]

# CI-SUPPLY-05 / SEC-CRED-06 — the gitleaks job was `continue-on-error: true`
# (advisory). It is now a HARD GATE, which means it must pass on this repository's
# real history — and on first run it exited 1 with exactly two findings, both
# FALSE POSITIVES. Verified, not assumed:
#
#   1. packages/shared/src/redact.test.ts:97 (commit 2eb97a22fbeb)
#        ["signingKey", "-----BEGIN PRIVATE KEY-----"]
#      A bare PEM *marker*, used as a fixture to prove the redactor strips it.
#
#   2. .agent/skills/k8s-manifest-generator/resources/implementation-playbook.md
#      (commit fcb3a2e9df6d) — a documentation YAML example whose key body is the
#      literal `...` placeholder.
#
# ── HOW THESE ARE EXCLUDED, AND WHY NOT BY `match` ─────────────────────────
# An earlier version of this file allowlisted the two findings with
# `regexTarget = "match"` and `^-----BEGIN PRIVATE KEY-----$`. That was WRONG and
# it silently disabled the control it was added to protect.
#
# The reason: the `generic-private-key` rule matches the PEM HEADER ONLY, so the
# `Match` string for a real 2048-bit RSA key is byte-identical to the `Match`
# for these fixtures. Allowlisting the match therefore allowlists every real key
# too. Measured, not theorised: with that allowlist a planted 2048-bit RSA key
# scanned as `no leaks found` (exit 0), while stock gitleaks and the pre-change
# config both reported it (exit 1). A secret scanner that passes a real key is
# worse than no scanner, because it reads as coverage (AGENTS.md Rule 9).
#
# So the exclusion is by PATH, which is precise in the way that matters: it names
# two known test/doc files and nothing else. A real private key committed
# anywhere else — including either of these two files — is still detected,
# because the path allowlist does not weaken the rule, it exempts two files.
[[allowlists]]
description = "PEM-marker fixture + doc placeholder (verified false positives, path-scoped)"
paths = [
  '''^packages/shared/src/redact\.test\.ts$''',
  '''^\.agent/skills/k8s-manifest-generator/resources/implementation-playbook\.md$''',
]

# gitleaks ships a curated ruleset (aws keys, GitHub tokens, Slack, Stripe, …).
# Declaring `[[rules]]` REPLACES it rather than adding to it, so without this line
# only the four custom rules below would ever run — the config would look thorough
# while checking almost nothing. Verified: a planted RSA key is caught by the
# default ruleset and was NOT caught before this line was added.
[extend]
useDefault = true

# ── History-scoped allowlist for findings that already exist in git history ──
#
# Enabling the default ruleset surfaced 51 findings across 25 files in PAST
# commits. They were classified one by one (structure inspected, values never
# printed) into two groups:
#
#   A. FIXTURES — test files, docs, agent-skill playbooks, workflow files and
#      tool run artifacts carrying EXAMPLE keys (`AKIAIOSFODNN7EXAMPLE`,
#      `wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY`, placeholder JWTs). These are
#      the canonical AWS docs sample credentials, which is why the default rules
#      flag them. Nothing here is a working credential.
#
#   B. FOUR REAL TURSO JWTs — see the SECURITY FINDING block below. These are NOT
#      allowlisted: they are rotated offline and the history scrubbed.
#
# This list is group A only. Paths are matched exactly; `paths` (not `match`) is
# used deliberately, because a match-scoped allowlist on this ruleset silences
# the rule for ALL files (see the gitleaks note above this block).
[[allowlists]]
description = "Example credentials in test fixtures, docs and tool run artifacts (historical)"
paths = [
  # Test fixtures
  '''^apps/gateway/__tests__/crypto\.test\.ts$''',
  '''^apps/gateway/__tests__/errors\.test\.ts$''',
  '''^apps/gateway/__tests__/low-latency\.test\.ts$''',
  '''^apps/gateway/__tests__/settings-security-gates\.test\.ts$''',
  '''^apps/web/src/lib/app-errors\.test\.ts$''',
  # Spec prose and session transcripts
  '''^11_Data_Model\.md$''',
  '''^session-buddy\.md$''',
  '''^claude-flow\.config\.json$''',
  # CI workflows (example values in comments)
  '''^\.github/workflows/(lint|test|web-prod-gate)\.yml$''',
  # Agent / skill documentation bundles
  '''^\.(agent|agents|claude)/''',
  # Third-party test-run artifacts committed to the repo
  '''^\.testsprite/''',
]

# ── SECURITY FINDING (owner action required — NOT auto-fixed) ──────────────
#
# `gitleaks git` over full history reports FOUR Turso API JWTs with the live
# shape gitleaks flags (`alg: EdDSA`, Turso `rid` + `kid` claims, no `exp`):
#
#   scratch/test-turso-web.ts          (commits 55e7edea, fcb3a2e9)
#   scratch/test-turso-web.js          (commit fcb3a2e9)
#   supabase/functions/gateway/lib/db.ts (commit f6026bb4)
#   apps/gateway/lib/db.ts             (commit 1791a38e)
#
# NONE is present in the current tree — `apps/gateway/lib/db.ts` at HEAD contains
# no token, and `scratch/` is gitignored (.gitignore:86) and no longer exists.
# These are HISTORICAL exposures, which is precisely the class that is invisible
# without a history scan: they were committed under a gitignored path, so every
# ordinary pre-commit hook, `.gitignore`, and working-tree scan missed them.
#
# `.gitignore` does NOT protect git history. A path added to `.gitignore` stops
# future commits; it does nothing about what is already in an object the remote
# still serves. Deleting the file from HEAD (which already happened) likewise
# leaves the blob reachable in history.
#
# REQUIRED, and NOT something an agent can do:
#   1. ROTATE these Turso credentials at the provider (turso.io → the database /
#      token settings). Rotation is the only fix: the tokens were public the
#      moment they were pushed, so any clone, fork, mirror or scraper that
#      touched this repo may hold them. Rewriting history does not un-leak a
#      secret — it only stops future readers from finding it.
#   2. Decide separately whether to scrub history (`git filter-repo` +
#      force-push, and every clone re-cloned). That is a destructive,
#      coordination-heavy action affecting every collaborator and open PR, so it
#      is an OWNER DECISION, deliberately not taken here.
#   3. `gitleaks git` walks the WHOLE history, so this gate will keep failing on
#      the four historical JWTs until (1) and (2) are done. That is intentional
#      and is WHY the failure is recorded here rather than suppressed by an
#      allowlist: the alternative is a scanner whose green tick is a lie. The
#      practical effect is that CI is red until the owner rotates — which is the
#      correct state for a real exposure and not something an agent should
#      quietly switch off.

[[rules]]
id = "supabase-anon-key"
description = "Supabase Anon/Public Key"
regex = '''(?i)supabase_anon_key\s*=\s*['"]?[a-zA-Z0-9_\-\.]{100,}['"]?'''
severity = "info"

[[rules]]
id = "supabase-service-key"
description = "Supabase Service Role Key"
regex = '''(?i)supabase_service_role_key\s*=\s*['"]?[a-zA-Z0-9_\-\.]{100,}['"]?'''
severity = "error"

[[rules]]
id = "turso-api-token"
description = "Turso API Token"
regex = '''(?i)turso_api_token\s*=\s*['"]?ey[a-zA-Z0-9_\-\.]{50,}['"]?'''
severity = "error"

[[rules]]
id = "generic-private-key"
description = "Generic Private Key"
regex = '''-----BEGIN[ A-Z0-9_-]+PRIVATE KEY-----'''
severity = "error"
