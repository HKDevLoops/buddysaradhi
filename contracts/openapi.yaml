openapi: 3.1.0
info:
  title: Buddysaradhi Gateway API
  version: 1.0.0
  description: The single source of truth contract for Buddysaradhi API Gateway.
# RFC-004 additive conventions (no path/method changes — minor only).
# The gateway emits typed `CODE: detail` error bodies (e.g.
# `CREDENTIALS_EXPIRED: ...re-provision required`, `VALIDATION: ...`,
# `CONFLICT: ...`, `DB_NOT_PROVISIONED: ...`, `RATE_LIMITED: ...`,
# `UNAUTHENTICATED: ...`, `INTERNAL: internal server error`) with the HTTP
# status matching the code family (401/400/409/503/429/401/500). The
# `ApiError.code` enum below is the legacy lowercase set; both shapes carry
# `message` + request correlation (`requestId` header echoed as
# `x-request-id`). A future contract minor will unify the enums.
x-error-convention: CODE_COLON_DETAIL
# RFC-004 C1: every mutating op (POST/PATCH/PUT/DELETE) requires
# `Idempotency-Key: <uuid>` (400 VALIDATION when missing/malformed).
# Duplicate key (same tenant + route) replays the stored response
# byte-identically with `X-Idempotent-Replayed: true`; no re-execution.
# RFC-004 C4: PATCH on shared rows accepts optional `base_updated_at`;
# mismatch yields 409 CONFLICT + safe `server_row` (absent base = legacy LWW).
x-idempotency: REQUIRED_ON_MUTATIONS
x-concurrency: CAS_OPT_IN_409
servers:
  - url: /api/v1
paths:
  /ledger:
    get:
      operationId: ledgerListEntries
      summary: Get ledger entries
      parameters:
        - name: tutorId
          in: query
          required: true
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerEntry'
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: ledgerPostEntry
      summary: Post a new ledger entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tutorId
                - studentId
                - kind
                - amountPaise
              properties:
                tutorId:
                  type: string
                studentId:
                  type: string
                batchId:
                  type: string
                kind:
                  type: string
                  enum: [fee_due, fee_paid, discount, refund]
                amountPaise:
                  type: integer
                  description: Amount in integer paise
                notes:
                  type: string
      responses:
        '200':
          description: Created ledger entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntry'
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /ledger/{id}/void:
    post:
      operationId: ledgerVoidEntry
      summary: Void a ledger entry (creates a reversing entry)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tutorId
                - reason
              properties:
                tutorId:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: The reversing entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntry'
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /ledger/balance:
    get:
      operationId: ledgerComputeBalance
      summary: Get the balance for a student
      parameters:
        - name: tutorId
          in: query
          required: true
          schema:
            type: string
        - name: studentId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The balance
          content:
            application/json:
              schema:
                type: object
                required:
                  - balancePaise
                properties:
                  balancePaise:
                    type: integer
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /security/erase:
    post:
      operationId: secureErase
      summary: Securely erase all tutor data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tutorId
                - confirm
                - pinProof
              properties:
                tutorId:
                  type: string
                confirm:
                  type: string
                pinProof:
                  # BR-SEC-04 / 10_Security.md 18.1 step 1 — the caller must PROVE
                  # knowledge of the security PIN. A configured PIN alone proves
                  # nothing about the caller, which is what let a stolen session
                  # erase an account. The edge cannot evaluate argon2id, so this
                  # is the HMAC proof it CAN verify (see `pinProof` in
                  # apps/gateway/lib/crypto.ts).
                  #
                  # The length and pattern bounds are load-bearing, not decoration:
                  # the value is compared in constant time against a stored string,
                  # and an unbounded field would let a caller POST a multi-megabyte
                  # string into that comparison.
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: '^[0-9a-f]{64}$'
                  description: >-
                    Lowercase hex HMAC-SHA256 proof of PIN knowledge, computed as
                    HMAC-SHA256(PIN_PEPPER, "buddysaradhi:pin-proof:v1:" + tenantId
                    + ":" + pin). Domain-separated from every other HMAC in the
                    system, and bound to the tenant.
      responses:
        '200':
          description: Data erased successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /settings/sync-apply:
    post:
      operationId: settingsSyncApply
      summary: Apply a PIN replica payload minted by setPinAction
      description: >-
        The ONLY edge writer of `pin_proof` (and of the `pin_hash` presence the
        erase gate reads). The web-local `setPinAction` stores the argon2id hash
        AND the HMAC proof in one transaction and replicates BOTH inside its
        `sync_outbox` payload; this endpoint applies that replica payload to the
        gateway DB the erase gate actually reads. PATCH keeps rejecting
        `pin_proof`/`pin_hash` — a client-settable proof there would be a
        self-issued erase credential. Every apply writes its own outbox row
        (marker only) + `settings.sync_apply` audit row (marker only) in the same
        transaction; the response, outbox payload and audit metadata never echo
        the credentials. Requires exactly one proof + one hash + one marker as a
        group (either spelling each); any unknown field is a 400 naming the
        field, never a silent strip.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
            description: RFC-004 C1 — fail-closed; missing/malformed key is 400 VALIDATION.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 3
              properties:
                pin_proof:
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: '^[0-9a-f]{64}$'
                  description: >-
                    Lowercase hex HMAC-SHA256 proof of PIN knowledge (same
                    bounds as secureErase pinProof). Either spelling accepted;
                    one proof is required.
                pinProof:
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: '^[0-9a-f]{64}$'
                  description: camelCase spelling of pin_proof.
                pin_hash:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: >-
                    Bounded opaque string: the edge never verifies it (no argon2
                    at the edge) and must not pin its format, or a future KDF
                    rotation bricks at the sync layer. Either spelling accepted;
                    one hash is required.
                pinHash:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: camelCase spelling of pin_hash.
                pin_updated_at:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: >-
                    Marker minted beside the proof; the only value the gateway's
                    own outbox payload and audit metadata carry. Either spelling
                    accepted; one marker is required.
                pinUpdatedAt:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: camelCase spelling of pin_updated_at.
      responses:
        '200':
          description: Replica applied; credentials never echoed
          content:
            application/json:
              schema:
                type: object
                required:
                  - applied
                properties:
                  applied:
                    type: boolean
                    example: true
        '400':
          description: >-
            VALIDATION — unknown field (named), malformed proof, missing
            proof/hash/marker group member, empty body, or missing/malformed
            Idempotency-Key. Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: Standard error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    LedgerEntry:
      type: object
      required:
        - id
        - tutorId
        - studentId
        - kind
        - amountPaise
        - createdAt
      properties:
        id:
          type: string
        tutorId:
          type: string
        studentId:
          type: string
        batchId:
          type: string
        kind:
          type: string
          enum: [fee_due, fee_paid, discount, refund, void]
        amountPaise:
          type: integer
        reversesEntryId:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    ApiError:
      type: object
      required:
        - code
        - message
        - operationId
        - traceId
      properties:
        code:
          type: string
          enum: [unauthenticated, forbidden, contract_violation, not_found, conflict, rate_limited, storage_unavailable, upstream_violation, internal]
        message:
          type: string
        retryAfterMs:
          type: integer
        operationId:
          type: string
        traceId:
          type: string
